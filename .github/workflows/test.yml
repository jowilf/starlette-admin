name: Test suite

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11.14", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Dependencies
        run: uv sync
      - name: Lint
        run: uv run poe lint
      - name: Test
        run: uv run poe test
      - name: store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*
          retention-days: 1
          include-hidden-files: true

  coverage:
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11.14"
          enable-cache: true
      - name: get coverage files
        uses: actions/download-artifact@v8
        with:
          pattern: coverage*
          merge-multiple: true
      - name: Install Dependencies
        run: uv sync --only-group cov --only-group dev
      - name: Coverage Report
        run: uv run poe cov-report
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    needs:
      - coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Dependencies
        run: uv sync
      - name: Install Playwright browsers
        run: uv run poe e2e-install
      - name: Test e2e
        run: uv run poe test-e2e
