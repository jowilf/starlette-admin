[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starlette-admin"
description = "Fast, beautiful and extensible administrative interface framework for FastAPI & Starlette applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jocelin Hounon", email = "hounonj@gmail.com" }]
dynamic = ["version"]

keywords = [
    "admin",
    "admin-dashboard",
    "admin-panel",
    "asgi",
    "beanie",
    "crud",
    "dashboard",
    "fastapi",
    "mongodb",
    "mongoengine",
    "odm",
    "orm",
    "sqlalchemy",
    "sqlmodel",
    "starlette",
    "tortoise-orm",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "itsdangerous >=2.2.0, <2.3.0",
    "jinja2 >=3.0.0, <4.0.0",
    "python-multipart >=0.0.18",
    "starlette >=0.40.0",
]

[project.urls]
Homepage = "https://github.com/jowilf/starlette-admin"
Documentation = "https://jowilf.github.io/starlette-admin"
Repository = "https://github.com/jowilf/starlette-admin"
Changelog = "https://jowilf.github.io/starlette-admin/changelog/"

[project.optional-dependencies]
email = ["email-validator >=2.0.0"]
i18n = ["babel >=2.17.0"]
pdf = ["reportlab >=4.5.1"]
s3 = ["aiobotocore >=2.5.0"]
tinymce = ["nh3 >=0.2.14"]

[dependency-groups]
dev = [
    "click",
    "faker >=40.23.0",
    "openrouter >=1.1.0",
    "poethepoet >=0.30.0, <0.49.0",
    "pre-commit >=2.20.0, <4.7.0",
    "requests",
    "uvicorn >=0.20.0, <0.53.0",
]

lint = ["ty ==0.0.62", "ruff ==0.15.21"]

test = [
    "aiobotocore >=2.5.0",
    "aiomysql >=0.1.1, <0.4.0",
    "aiosqlite >=0.17.0, <0.23.0",
    "arrow >=1.2.3, <1.5.0",
    "asyncpg >=0.27.0, <0.32.0",
    "babel >=2.17.0",
    "beanie >=2.0.0",
    "boto3 >=1.43.0",
    "colour >=0.1.5, <0.2.0",
    "djlint >=1.39.2",
    "email-validator >=2.0.0",
    "fasteners >=0.19.0, <0.21.0",
    "httpx >=0.23.3, <0.29.0",
    "httpx2 >=2.4.0",
    "itsdangerous >=2.2.0, <2.3.0",
    "mongoengine >=0.25.0, <0.30.0",
    "nh3 >=0.2.14",
    "openpyxl >=3.0.0",
    "passlib >=1.7.4, <1.8.0",
    "tablib[all] >=3.9.0",
    "phonenumbers >=8.13.3, <9.1.0",
    "Pillow >=9.4.0, <12.4.0",
    "psycopg2-binary >=2.9.5, <3.0.0",
    "pydantic[email] >=1.10.2, <2.14.0",
    "PyMySQL[rsa] >=1.0.2, <1.3.0",
    "pytest >=8.3.0, <9.2.0",
    "pytest-asyncio >=0.24.0, <1.5.0",
    "reportlab >=4.0.0",
    "SQLAlchemy-Utils >=0.40.0, <0.43.0",
    "sqlalchemy-file >=0.5.0, <0.7.0",
    "SQLAlchemy[asyncio] >=2.0.0, <2.1.0",
    "sqlmodel >=0.0.11, <0.1.0",
    "testcontainers[minio,mongodb,mysql,postgres] >=4.8.0",
    "tinydb >=4.7.0, <4.10.0",
    "tortoise-orm >=0.21.0",
]

cov = ["coverage[toml] >=7.0.0, <7.16.0"]
docs = [
    "mkdocstrings[python] >=0.27.0",
    "zensical >=0.0.44",
]
e2e = ["pytest-playwright >=0.5.0, <0.10.0"]

[tool.uv]
default-groups = ["dev", "lint", "test", "cov", "docs", "e2e"]

[tool.uv.workspace]
members = [".", "examples/*", "examples/advanced/*"]
exclude = ["examples/advanced", "examples/__pycache__"]

[tool.poe.tasks]
# Code quality
format = ["_ruff-fix", "_ruff-format", "_dj-lint-format"]
lint = ["_ty", "_ruff-check", "_ruff-format-check"]
_ruff-fix = "ruff check starlette_admin tests examples --fix --unsafe-fixes"
_ruff-format = "ruff format starlette_admin tests examples"
_dj-lint-format = "djlint starlette_admin tests examples --reformat --format-css --format-js"
_ty = "ty check starlette_admin"
_ruff-check = "ruff check starlette_admin tests examples"
_ruff-format-check = "ruff format starlette_admin tests examples --check"

# Tests
test = "coverage run -m pytest tests --ignore=tests/e2e"
test-sqla = "coverage run -m pytest tests/integration/sqla"
test-e2e = "pytest tests/e2e"
e2e-install = "playwright install --with-deps chromium"

# Coverage
cov-report = ["_cov-combine", "_cov-report", "_cov-xml", "_cov-html"]
_cov-combine = "coverage combine"
_cov-report = "coverage report --show-missing"
_cov-xml = "coverage xml"
_cov-html = "coverage html"

# i18n
i18n-init = "python i18n/main.py"
i18n-extract = "pybabel extract -F i18n/babel.ini -k _n -o i18n/admin.pot --project starlette-admin starlette_admin"
i18n-update = "pybabel update -i i18n/admin.pot -d starlette_admin/translations -D admin"
i18n-compile = "pybabel compile -f -D admin -d starlette_admin/translations"

# Clean
clean = "rm -rf .coverage .coverage.* coverage.xml site .ruff_cache dist build .cache .pytest_cache htmlcov"

# Docs
docs-serve = "python docs/scripts/serve.py"
docs-build = "python docs/scripts/build.py"
docs-serve-all = "python docs/scripts/serve.py --locales all"
docs-build-all = "python docs/scripts/build.py --locales all"
docs-serve-prod = "python docs/scripts/serve.py --locales all --alternate-prefix /starlette-admin"
docs-build-prod = "python docs/scripts/build.py --locales all --alternate-prefix /starlette-admin"
docs-translate = "python docs/scripts/translate.py"

[tool.hatch.version]
path = "starlette_admin/__init__.py"

[tool.hatch.build.targets.wheel]
include = ["starlette_admin", ".agents"]

[tool.hatch.build.targets.sdist]
include = ["starlette_admin", ".agents"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except NotImplementedError",
    "except ImportError",
]

[tool.coverage.run]
parallel = true
concurrency = ["thread", "greenlet"]
source = ["starlette_admin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

lint.select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "F",   # pyflakes
    "I",   # isort
    "INT", # flake8-gettext
    "N",   # pep8-naming
    "PIE", # flake8-pie,
    "PLC", # pylint - convention
    "PLE", # pylint - error
    "PLW", # pylint - warning
    "Q",   # flake8-quotes
    "RET", # flake8-return,
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

lint.ignore = [
    "B008",    # Do not perform function call `_` in argument defaults (necessary for lazy_gettext)
    "B905",    # `zip()` without an explicit `strict=` parameter
    "E501",    # line too long (handled by ruff format)
    "N818",    # Exception {name} should be named with an Error suffix
    "PLC0415", # `import` should be at the top-level of a file
]

[tool.ruff.lint.isort]
known-third-party = ["starlette_admin"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "PLC0414"]
"examples/**" = ["N805", "N999", "RUF012"]
"examples/**/seed.py" = ["T201"]
"docs/scripts/**" = ["T201"]
"tests/**" = ["RUF012", "SIM115"]

[tool.ty.rules]
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.djlint]
profile = "jinja"
