<div class="sa-rating {% if error %}{{ field.error_class }}{% endif %}"
     data-sa-rating
     data-max="{{ field.max_stars }}">
    {% for i in range(1, field.max_stars + 1) %}
        <input type="radio"
               id="{{ field.id }}-{{ i }}"
               name="{{ field.id }}"
               value="{{ i }}"
               {% if data and data|int >= i %}checked{% endif %}
               {% if field.disabled or field.read_only %}disabled{% endif %}>
        <label for="{{ field.id }}-{{ i }}"
               class="sa-rating-star"
               aria-label="{{ i }} star{{ 's' if i > 1 else '' }}">&#9733;</label>
    {% endfor %}
    {% if field.help_text %}<small class="form-hint mt-2">{{ field.help_text }}</small>{% endif %}
</div>
{% include "fields/form/_error.html" %}
