{# Theme override of the core form footer. Restyles the secondary buttons:
   Bootstrap/AdminLTE leaves a bare `.btn` transparent, so the two alternate
   submit buttons get `btn-outline-secondary` to match the toolbar. The
   `sa-animate-icon` animation is wired up in theme.css. #}
<div class="card-footer">
    <div class="btn-list ms-auto justify-content-end">
        <a href="{{ back_url(request, view.key) }}"
           class="btn btn-danger btn-animate-icon btn-animate-icon-rotate">
            <i class="{{ icon('form.cancel') }} sa-animate-icon me-1"></i>{{ _("Cancel") }}
        </a>
        <button type="submit" name="_add_another" class="btn btn-outline-secondary">{{ _("Save and add another") }}</button>
        <button type="submit" name="_continue_editing" class="btn btn-outline-secondary">{{ _("Save and continue editing") }}</button>
        <button type="submit" class="btn btn-primary btn-animate-icon">
            {{ _("Save") }}
            <i class="{{ icon('form.save') }} sa-animate-icon ms-1"></i>
        </button>
    </div>
</div>
