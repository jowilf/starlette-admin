[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starlette-admin-adminlte"
description = "A starlette-admin theme"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jocelin Hounon", email = "hounonj@gmail.com" }]
version = "0.1.0"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
    "email-validator>=2.3.0",
    "nh3>=0.3.6",
    "pillow>=12.3.0",
    "starlette-admin[i18n]",
]

[project.urls]
Homepage = "https://github.com/jowilf/starlette-admin-adminlte"
Repository = "https://github.com/jowilf/starlette-admin-adminlte"

[project.entry-points."starlette_admin.themes"]
adminlte = "starlette_admin_adminlte:AdminlteTheme"

[project.optional-dependencies]
i18n = ["babel>=2.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/starlette_admin_adminlte"]

# Uncomment when developing this theme inside the starlette-admin monorepo
# (themes/adminlte), so `uv sync` links the local core
# checkout instead of resolving it from PyPI:
# [tool.uv.sources]
# starlette-admin = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
starlette-admin = { path = "../../", editable = true }
