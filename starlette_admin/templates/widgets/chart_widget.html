<div class="card">
    {% if title %}
        <div class="card-header">
            <h3 class="card-title">{{ title }}</h3>
        </div>
    {% endif %}
    <div class="card-body">
        <div class="apex-chart"
             id="{{ chart_id }}"
             data-type="{{ chart_type }}"
             data-height="{{ height }}"
             data-series='{{ series | tojson }}'
             data-options='{{ options | tojson }}'></div>
    </div>
</div>
