{% from "fields/_copy_button.html" import copy_button %}
{% if field.copy_to_clipboard %}
    <span class="d-inline-flex align-items-center gap-2">
        <a href="mailto:{{ data }}">{{ data }}</a>
        {{ copy_button(data) }}
    </span>
{% else %}
    <a href="mailto:{{ data }}">{{ data }}</a>
{% endif %}
