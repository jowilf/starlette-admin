{% if data | is_iter %}
    <ul>
        {% for value in data %}
            <li>
                <span class="badge me-1" style="background-color:{{ value }};">&nbsp;</span>{{ value }}
            </li>
        {% endfor %}
    </ul>
{% else %}
    <span class="badge me-1" style="background-color:{{ data }};">&nbsp;</span>{{ data }}
{% endif %}
