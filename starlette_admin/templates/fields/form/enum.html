{% set describedby = ((field.id ~ '-error') if error else None, (field.id ~ '-help') if field.help_text else None) | select | join(' ') %}
<div class="{% if error %}{{ cls(field.error_class) }}{% endif %}">
    <select id="{{ field.id }}"
            name="{{ field.id }}"
            data-allow-clear="true"
            data-placeholder="{{ _('Select a %(label)s', label=field.label) }}"
            class="field-enum {{ cls(field.class_) }} {% if error %}{{ cls(field.error_class) }}{% endif %}"
            {% if error %}aria-invalid="true"{% endif %}
            {% if describedby %}aria-describedby="{{ describedby }}"{% endif %}
            {% if field.multiple %}multiple{% endif %}
            {% if field.disabled %}disabled{% endif %}
            {% if field.select2 %}data-role="select2"{% endif %}>
        {% if not field.multiple and not field.required %}<option></option>{% endif %}
        {% for value, label in field._get_choices(request) %}
            <option value="{{ value }}"
                    {{ 'selected' if (data is not none and (value in (data if field.multiple else [data]))) else '' }}>{{ label }}
            </option>
        {% endfor %}
    </select>
    {% if field.help_text %}<small class="form-hint mt-2" id="{{ field.id }}-help">{{ field.help_text }}</small>{% endif %}
</div>
{% include "fields/form/_error.html" %}
