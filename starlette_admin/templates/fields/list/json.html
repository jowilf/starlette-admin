{# inline-edit-value marks the underline target for inline-editable cells. #}
<div class="field-json d-inline-block align-middle text-truncate inline-edit-value"
     data-json="{{ data|tojson|forceescape }}"
     data-collapsed="{{ field.viewer_collapsed|tojson }}"
     data-with-quotes="{{ field.viewer_with_quotes|tojson }}"
     data-with-links="{{ field.viewer_with_links|tojson }}"
     data-root-collapsable="{{ field.viewer_root_collapsable|tojson }}"
     style="max-width: 30em"></div>
