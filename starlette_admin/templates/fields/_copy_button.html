{% macro copy_button(value) -%}
    <button type="button"
            class="{{ cls('field.copy_button') }} copy-to-clipboard"
            data-copy-value="{{ value }}"
            title="{{ _('Copy to clipboard') }}"
            aria-label="{{ _('Copy to clipboard') }}">
        <i class="{{ icon('action.copy') }}" aria-hidden="true"></i>
    </button>
{%- endmacro %}
