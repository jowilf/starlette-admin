<div class="modal modal-blur fade"
     id="modal-import"
     tabindex="-1"
     role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ _("Import") }}</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="{{ _('Close') }}"></button>
            </div>
            <div class="modal-body">
                <div id="import-form-section">
                    <form id="import-form" enctype="multipart/form-data" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="import-format">{{ _("Format") }}</label>
                            <select class="form-select" name="format" id="import-format">
                                {% for fmt in view.importers %}
                                    <option value="{{ fmt.format_key or fmt.extension }}">{{ (fmt.format_key or fmt.extension) | upper }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="import-file">{{ _("File") }}</label>
                            <input type="file"
                                   class="form-control"
                                   name="file"
                                   id="import-file"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-check">
                                <input type="checkbox" class="form-check-input" id="import-dry-run">
                                <span class="form-check-label">{{ _("Dry run (validate without saving)") }}</span>
                            </label>
                        </div>
                        <div class="mb-3">
                            <label class="form-check">
                                <input type="checkbox" class="form-check-input" id="import-skip-pk">
                                <span class="form-check-label">{{ _("Skip primary key column") }}</span>
                            </label>
                            <div class="form-text text-muted">
                                {{ _("Use this when your file contains a primary key column but your backend auto-generates keys. The column will be ignored and a new key will be assigned.") }}
                            </div>
                        </div>
                    </form>
                    <div id="import-error" class="alert alert-danger d-none" role="alert"></div>
                </div>
                <div id="import-results" class="d-none">
                    <div id="import-summary" class="mb-3"></div>
                    <div id="import-errors-table"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-link link-secondary me-auto"
                        data-bs-dismiss="modal">{{ _("Cancel") }}</button>
                <button type="button" class="btn btn-primary" id="import-submit">
                    <i class="fa-solid fa-upload me-2"></i>{{ _("Import") }}
                </button>
            </div>
        </div>
    </div>
</div>
