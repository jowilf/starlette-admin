{% macro render(filter_chips, filter_logic, list_params) -%}
    <div class="d-flex flex-wrap align-items-center gap-2" id="active-filters">
        <span class="text-muted">{{ _("Filters:") }}</span>
        {% for chip in filter_chips %}
            {% if not loop.first %}
                <span class="text-muted small fw-medium">{{ filter_logic | upper }}</span>
            {% endif %}
            <a href="{{ chip.remove_url }}"
               class="{{ cls('filter.chip') }}"
               data-bs-toggle="tooltip"
               title="{{ _('Remove this filter') }}"
               aria-label="{{ _('Remove this filter') }}: {{ chip.label }}">
                {{ chip.label }}
                <i class="{{ icon('filter.remove_chip') }}" aria-hidden="true"></i>
            </a>
        {% endfor %}
        <a href="{{ list_url(request, filter=None, page=None) }}"
           class="text-muted text-decoration-none small">{{ _("Clear all") }}</a>
    </div>
{%- endmacro %}
